[project]
name = "homelab-mcp"
version = "1.8.0"
description = "MCP server for homelab VM infrastructure management with service installation framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "pyyaml>=6.0",
    # >=2.23.1 fixes the SCP path-traversal advisory; we use start_sftp_client.
    "asyncssh>=2.24.0",
    "jsonschema>=4.24.0",
    "httpx>=0.28.1",
    # Floor clears 19 advisories. The <3.14 ceiling is not a security choice:
    # aioresponses 0.7.9 (latest) breaks on 3.14's ClientResponse.__init__
    # stream_writer kwarg. Drop the ceiling once aioresponses supports 3.14 --
    # 14 aiohttp advisories stay open until then.
    "aiohttp>=3.13.4,<3.14",
    "aiofiles>=24.1.0",
    "rich>=13.10.5",
    # HTTP transport dependencies
    "starlette>=0.30.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "keyring>=25.6.0",
    "fastapi>=0.135.3",
]

[project.optional-dependencies]
monitoring = [
    "pandas>=2.2.3",
    # >=23.0.1 fixes the IPC use-after-free advisory.
    "pyarrow>=23.0.1",
]
automation = [
    # ansible-playbook is invoked as a subprocess, never imported.
    # paramiko was dropped here: nothing imported it (asyncssh handles all SSH)
    # and it carried an advisory with no published patch.
    "ansible>=2.9.0",
]
ai = [
    "ollama>=0.4.4",
]
security = [
    # >=50.0.0 clears the bundled-OpenSSL, subgroup-validation and PKCS#7
    # Bleichenbacher advisories.
    "cryptography>=50.0.1",
]

[project.scripts]
homelab-mcp = "homelab_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_mcp"]
include = [
    "src/homelab_mcp/**/*.yaml",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "aioresponses>=0.7.6",
    "coverage[toml]>=7.9.1",
    "docker>=7.0.0",
    # Code quality
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # Security
    "bandit>=1.7.0",
    "safety>=3.0.0",
    # Development tools
    "ipython>=8.0.0",
    "types-pyyaml>=6.0.12.20250915",
    "types-jsonschema>=4.24.0",
    "pre-commit>=4.3.0",
]

[tool.uv]

[tool.uv.sources]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "*.egg",
    "__pycache__",
    ".uv",
    "setup-uv-cache",
    "_temp",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "network: Tests requiring network access",
    "ssh: Tests requiring SSH connectivity",
    "database: Tests requiring database",
    "ansible: Tests requiring Ansible",
    "vm: Tests for VM operations",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["testsprite_tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["B018", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Compatibility shim: try/except import of StreamableHTTPSessionManager from
# two different MCP SDK module paths. The `type: ignore` on the fallback import
# is needed when running mypy against the installed MCP package (which has the
# class in streamable_http but mypy reports attr-defined + no-redef), yet the
# same comment is "unused" when running with --ignore-missing-imports (pre-commit
# isolated env). Disable warn_unused_ignores for this module only.
module = "homelab_mcp.http_app"
warn_unused_ignores = false

[[tool.mypy.overrides]]
# psycopg2 is an optional PostgreSQL backend dependency imported inside a
# try/except ImportError block in database.py. No stubs package exists in
# this environment. Suppress missing-import errors for the whole module family.
module = ["psycopg2", "psycopg2.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]  # Skip assert_used and shell=True warnings in tests
