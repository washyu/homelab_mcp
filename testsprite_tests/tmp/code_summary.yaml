version: "2"
type: backend
tech_stack:
  - Python 3.12+
  - FastAPI
  - Starlette
  - Uvicorn
  - asyncssh
  - SQLite
  - MCP (Model Context Protocol)
  - asyncio
features:
  - name: System
    description: Health, discovery, and tool listing endpoints
    files:
      - src/homelab_mcp/openapi_app.py
    endpoints:
      - method: GET
        path: /health
        description: Server health and request/error counters
        auth_required: false
        response_schema:
          "200": "{status, result:{server_status, uptime_seconds, total_requests, total_errors, error_rate, transport}}"
      - method: GET
        path: /api/tools
        description: List all 56 registered tools with categories, schemas, and infrastructure flags
        auth_required: false
        response_schema:
          "200": "{tools:[{name, description, category, requires_infrastructure, input_schema}], count}"
      - method: GET
        path: /docs
        description: Swagger UI auto-generated from per-tool schemas
        auth_required: false
      - method: GET
        path: /openapi.json
        description: OpenAPI 3.x specification
        auth_required: false
  - name: SSH Tools
    description: Discover and administer remote hosts over SSH (port 22). All endpoints run a TCP preflight on hostname:22 and return 424 if the target is unreachable.
    files:
      - src/homelab_mcp/ssh_tools.py
      - src/homelab_mcp/tool_handlers/ssh_handlers.py
      - src/homelab_mcp/tool_schemas/ssh_tools_schema.py
    endpoints:
      - method: POST
        path: /api/tools/ssh_discover
        description: SSH into a host and gather hardware/system info
        auth_required: false
        request_schema:
          body: "{hostname:string (required), username?:string, password?:string, port?:int}"
        response_schema:
          "200": "{status:success, tool, result}"
          "424": "{status:failed_dependency, host, port, protocol, error, requires}"
          "500": "{status:error, tool, error}"
      - method: POST
        path: /api/tools/setup_mcp_admin
        description: Create mcp_admin user with SSH key on remote host
        auth_required: false
        request_schema:
          body: "{hostname:string (required), admin_user?:string, admin_password?:string}"
        response_schema:
          "200": Success
          "424": External target unreachable
      - method: POST
        path: /api/tools/verify_mcp_admin
        description: Verify mcp_admin SSH access works
        auth_required: false
        request_schema:
          body: "{hostname:string (required)}"
        response_schema:
          "200": Success
          "424": External target unreachable
      - method: POST
        path: /api/tools/ssh_execute_command
        description: Execute an arbitrary command on a remote host
        auth_required: false
        request_schema:
          body: "{hostname:string (required), command:string (required), use_sudo?:bool}"
        response_schema:
          "200": Success
          "424": External target unreachable
      - method: POST
        path: /api/tools/start_interactive_shell
        description: Open a websocket-backed interactive shell session
        auth_required: false
        request_schema:
          body: "{hostname:string (required), initial_command?:string}"
        response_schema:
          "200": "{session_id, websocket_url}"
          "424": External target unreachable
      - method: POST
        path: /api/tools/update_mcp_admin_groups
        description: Add mcp_admin to groups (docker, sudo, etc.)
        auth_required: false
        request_schema:
          body: "{hostname:string (required), groups:string[]}"
        response_schema:
          "200": Success
          "424": External target unreachable
  - name: Network Discovery
    description: Network mapping, topology analysis, and device tracking. discover_and_map runs an SSH preflight; sitemap/analysis tools work on the local SQLite DB.
    files:
      - src/homelab_mcp/sitemap.py
      - src/homelab_mcp/tool_handlers/network_handlers.py
      - src/homelab_mcp/tool_schemas/network_tools_schema.py
    endpoints:
      - method: POST
        path: /api/tools/discover_and_map
        description: Discover a host via SSH and add to sitemap
        auth_required: false
        request_schema:
          body: "{hostname:string (required)}"
        response_schema:
          "200": Success
          "424": External target unreachable
      - method: POST
        path: /api/tools/bulk_discover_and_map
        description: Discover multiple hosts (no preflight; per-host failures inline). Body field is `targets`, not `hosts`.
        auth_required: false
        request_schema:
          body: "{targets:[{hostname:string, username:string, password?:string, key_path?:string, port?:int}] (required)}"
        response_schema:
          "200": "{status, total_targets, results:[{status, hostname, ...}]}"
          "422": Missing or malformed `targets` array
      - method: POST
        path: /api/tools/get_network_sitemap
        description: Return all known devices from local DB
        auth_required: false
        response_schema:
          "200": "{devices:[]}"
      - method: POST
        path: /api/tools/analyze_network_topology
        description: Topology analysis over local DB
        auth_required: false
        response_schema:
          "200": Analysis result
      - method: POST
        path: /api/tools/suggest_deployments
        description: Suggest service placements based on topology
        auth_required: false
        response_schema:
          "200": Suggestions
      - method: POST
        path: /api/tools/get_device_changes
        description: Change history per device
        auth_required: false
        response_schema:
          "200": Change list
  - name: VM & Container Management
    description: Deploy and control VMs/containers via SSH-managed Docker/LXD hosts. No preflight (uses stored target config rather than body hostname).
    files:
      - src/homelab_mcp/vm_operations.py
      - src/homelab_mcp/tool_handlers/vm_handlers.py
      - src/homelab_mcp/tool_schemas/vm_tools_schema.py
    endpoints:
      - method: POST
        path: /api/tools/deploy_vm
        description: Deploy a VM/container against a previously-registered device. Targets a stored device by integer `device_id` (NOT hostname). Returns 412 when device_id is unknown or no infrastructure is registered.
        auth_required: false
        request_schema:
          body: "{device_id:int (required), platform:string-enum[docker,lxd] (required), vm_name:string (required), vm_config?:object}"
        response_schema:
          "200": "{status, tool, result:{container_id, access_info, ...}}"
          "412": "Device not found / no infrastructure registered (status=precondition_failed, requires field included)"
          "422": Missing or malformed required fields
      - method: POST
        path: /api/tools/control_vm
        description: Start/stop/restart a VM
        auth_required: false
      - method: POST
        path: /api/tools/get_vm_status
        description: Status of a VM
        auth_required: false
      - method: POST
        path: /api/tools/list_vms
        description: List all VMs across hosts
        auth_required: false
      - method: POST
        path: /api/tools/get_vm_logs
        description: Fetch VM logs
        auth_required: false
      - method: POST
        path: /api/tools/remove_vm
        description: Delete a VM
        auth_required: false
      - method: POST
        path: /api/tools/remove_vm_preview
        description: Dry-run preview of VM deletion
        auth_required: false
  - name: Service Installation
    description: YAML-template-driven service installation with Terraform/Ansible support. Installation tools preflight hostname:22.
    files:
      - src/homelab_mcp/service_installer.py
      - src/homelab_mcp/tool_handlers/service_handlers.py
      - src/homelab_mcp/tool_schemas/service_tools_schema.py
      - src/homelab_mcp/service_templates/
    endpoints:
      - method: POST
        path: /api/tools/list_available_services
        description: List services from local YAML templates
        auth_required: false
        response_schema:
          "200": "{available_services:[]}"
      - method: POST
        path: /api/tools/get_service_info
        description: Metadata for a known service template
        auth_required: false
        request_schema:
          body: "{service:string (required)}"
      - method: POST
        path: /api/tools/check_service_requirements
        description: Check if a host meets service requirements
        auth_required: false
        request_schema:
          body: "{hostname:string (required), service:string (required)}"
        response_schema:
          "424": External target unreachable
      - method: POST
        path: /api/tools/install_service
        description: Install service on a host
        auth_required: false
        request_schema:
          body: "{hostname:string (required), service:string (required)}"
        response_schema:
          "424": External target unreachable
      - method: POST
        path: /api/tools/get_service_status
        description: Status of an installed service
        auth_required: false
        request_schema:
          body: "{hostname:string (required), service:string (required)}"
        response_schema:
          "424": External target unreachable
      - method: POST
        path: /api/tools/plan_terraform_service
        description: Terraform plan for a service
        auth_required: false
        request_schema:
          body: "{hostname:string (required), service:string (required)}"
        response_schema:
          "424": External target unreachable
      - method: POST
        path: /api/tools/destroy_terraform_service
        description: Terraform destroy
        auth_required: false
        response_schema:
          "424": External target unreachable
      - method: POST
        path: /api/tools/destroy_terraform_service_preview
        description: Terraform destroy preview
        auth_required: false
        response_schema:
          "424": External target unreachable
      - method: POST
        path: /api/tools/refresh_terraform_service
        description: Terraform refresh
        auth_required: false
        response_schema:
          "424": External target unreachable
      - method: POST
        path: /api/tools/check_ansible_service
        description: Check Ansible-managed service state
        auth_required: false
        response_schema:
          "424": External target unreachable
      - method: POST
        path: /api/tools/run_ansible_playbook
        description: Run an Ansible playbook against a host
        auth_required: false
        response_schema:
          "424": External target unreachable
  - name: Credentials
    description: Credential storage for remote hosts. register_server preflights hostname:22; the rest are local-only.
    files:
      - src/homelab_mcp/tool_handlers/credential_handlers.py
      - src/homelab_mcp/tool_schemas/credential_tools_schema.py
    endpoints:
      - method: POST
        path: /api/tools/register_server
        description: Store credentials for a host (verifies via SSH connect)
        auth_required: false
        request_schema:
          body: "{hostname:string (required), username:string, password:string}"
        response_schema:
          "200": Success
          "424": External target unreachable
      - method: POST
        path: /api/tools/list_registered_servers
        description: List stored credential aliases
        auth_required: false
      - method: POST
        path: /api/tools/update_server_credentials
        description: Update stored credentials
        auth_required: false
      - method: POST
        path: /api/tools/remove_server
        description: Delete stored credentials
        auth_required: false
      - method: POST
        path: /api/tools/remove_server_preview
        description: Preview credential removal
        auth_required: false
  - name: Infrastructure Lifecycle
    description: Infrastructure deployment and rollback. No preflight (operates on declarative target sets, not single body hostname).
    files:
      - src/homelab_mcp/infrastructure_crud.py
      - src/homelab_mcp/tool_handlers/infrastructure_handlers.py
      - src/homelab_mcp/tool_schemas/infrastructure_tools_schema.py
    endpoints:
      - method: POST
        path: /api/tools/deploy_infrastructure
        description: Deploy infrastructure changes
        auth_required: false
      - method: POST
        path: /api/tools/update_device_config
        description: Update a device's configuration
        auth_required: false
      - method: POST
        path: /api/tools/decommission_device
        description: Decommission a device
        auth_required: false
      - method: POST
        path: /api/tools/decommission_device_preview
        description: Preview a decommission
        auth_required: false
      - method: POST
        path: /api/tools/scale_services
        description: Scale services up/down across hosts
        auth_required: false
      - method: POST
        path: /api/tools/validate_infrastructure_changes
        description: Validate planned changes
        auth_required: false
      - method: POST
        path: /api/tools/create_infrastructure_backup
        description: Snapshot current infrastructure state
        auth_required: false
      - method: POST
        path: /api/tools/rollback_infrastructure_changes
        description: Rollback to a prior backup
        auth_required: false
      - method: POST
        path: /api/tools/rollback_infrastructure_changes_preview
        description: Preview a rollback
        auth_required: false
  - name: Proxmox
    description: Proxmox VE management via the Proxmox API on port 8006. Most tools preflight host:8006; script search/info hit GitHub instead.
    files:
      - src/homelab_mcp/tool_handlers/proxmox_handlers.py
      - src/homelab_mcp/tool_schemas/proxmox_tools_schema.py
    endpoints:
      - method: POST
        path: /api/tools/search_proxmox_scripts
        description: Search community scripts on GitHub
        auth_required: false
      - method: POST
        path: /api/tools/get_proxmox_script_info
        description: Get metadata for a community script
        auth_required: false
      - method: POST
        path: /api/tools/list_proxmox_resources
        description: List all VMs/LXC/storage on a Proxmox node
        auth_required: false
        request_schema:
          body: "{host:string (required), user?:string, password?:string}"
        response_schema:
          "200": Resource list
          "424": Proxmox API unreachable on port 8006
      - method: POST
        path: /api/tools/get_proxmox_node_status
        description: Node status (CPU/mem/uptime)
        auth_required: false
        request_schema:
          body: "{host:string (required)}"
        response_schema:
          "424": Proxmox API unreachable
      - method: POST
        path: /api/tools/get_proxmox_vm_status
        description: VM status on a Proxmox host
        auth_required: false
        request_schema:
          body: "{host:string (required), vmid?:int}"
        response_schema:
          "424": Proxmox API unreachable
      - method: POST
        path: /api/tools/manage_proxmox_vm
        description: Start/stop/reset a Proxmox VM
        auth_required: false
        response_schema:
          "424": Proxmox API unreachable
      - method: POST
        path: /api/tools/create_proxmox_lxc
        description: Create an LXC container
        auth_required: false
        response_schema:
          "424": Proxmox API unreachable
      - method: POST
        path: /api/tools/create_proxmox_vm
        description: Create a Proxmox VM
        auth_required: false
        response_schema:
          "424": Proxmox API unreachable
      - method: POST
        path: /api/tools/clone_proxmox_vm
        description: Clone a VM from a template
        auth_required: false
        response_schema:
          "424": Proxmox API unreachable
      - method: POST
        path: /api/tools/delete_proxmox_vm
        description: Delete a Proxmox VM
        auth_required: false
        response_schema:
          "424": Proxmox API unreachable
      - method: POST
        path: /api/tools/delete_proxmox_vm_preview
        description: Preview a Proxmox VM deletion
        auth_required: false
        response_schema:
          "424": Proxmox API unreachable
  - name: Drift Detection
    description: Compare current Proxmox state against stored baselines.
    files:
      - src/homelab_mcp/tool_handlers/drift_handlers.py
      - src/homelab_mcp/tool_schemas/drift_tools_schema.py
    endpoints:
      - method: POST
        path: /api/tools/scan_infrastructure_drift
        description: Scan for drift between baseline and live infrastructure
        auth_required: false
        response_schema:
          "200": Drift report
          "412": No baseline or no PROXMOX_HOST configured
  - name: External Dependency Preflight
    description: TCP-connect probe (1s timeout) runs before each tool that targets an external host, returning HTTP 424 with host/port/protocol/requires fields when the target is unreachable. Applies to 26 tools across SSH (port 22) and Proxmox (port 8006). Standalone tools (local DB / GitHub / template reads) are not preflighted.
    files:
      - src/homelab_mcp/openapi_app.py
known_limitations:
  - issue: Authentication mode is fixed at server start (--no-auth or --api-key); cannot toggle per-request, so test suites must run two separate servers to exercise both modes.
    location: run_server.py
    impact: Auth coverage requires multiple test runs against differently-configured servers.
  - issue: Preflight uses TCP-connect only — does not validate SSH/Proxmox protocol handshake. A host with port 22/8006 open but a different service listening will pass the probe.
    location: src/homelab_mcp/openapi_app.py _check_reachable
    impact: False positives possible; preflight is a fast-fail mechanism, not a correctness check.
  - issue: bulk_discover_and_map and infrastructure-lifecycle tools target multiple hosts and do not undergo preflight; per-host failures surface inside the response body.
    location: src/homelab_mcp/openapi_app.py EXTERNAL_REQUIREMENTS
    impact: 424 contract does not apply to these endpoints.
  - issue: Proxmox tools resolve target from request body field 'host'; PROXMOX_HOST environment variable is not currently used as a fallback for preflight (handler may still use it).
    location: src/homelab_mcp/openapi_app.py _resolve_external_host
    impact: Requests omitting 'host' bypass preflight even when PROXMOX_HOST is set.
