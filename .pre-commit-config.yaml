# Pre-commit hooks for development - focuses on auto-fixable issues
# For strict checking use: pre-commit run --config .pre-commit-config-strict.yaml --all-files
repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      # Run the linter with auto-fix
      - id: ruff
        name: ruff lint
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      # Run the formatter
      - id: ruff-format
        name: ruff format
        types_or: [python, pyi]

  # Mypy - type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.1
    hooks:
      - id: mypy
        name: mypy type check
        args: [--ignore-missing-imports]
        additional_dependencies: [types-pyyaml, asyncssh>=2.14.0, aiohttp>=3.9.0]
        pass_filenames: false
        entry: mypy src

  # General code quality hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Check for files that would conflict on case-insensitive filesystems
      - id: check-case-conflict
      # Check for files that contain merge conflict strings
      - id: check-merge-conflict
      # Check yaml files for parseable syntax
      - id: check-yaml
        exclude: ^(.github/|docs/|examples/)
      # Check json files for parseable syntax
      - id: check-json
      # Check toml files for parseable syntax
      - id: check-toml
      # Ensure files end with newline
      - id: end-of-file-fixer
        exclude: ^(\.svg$|\.png$|\.jpg$|\.jpeg$|\.gif$)
      # Remove trailing whitespace
      - id: trailing-whitespace
        exclude: ^(\.svg$|\.png$|\.jpg$|\.jpeg$|\.gif$)
      # Check for debugger imports and py37+ breakpoint() calls
      - id: debug-statements
      # Check python ast
      - id: check-ast

# Global configuration
default_stages: [pre-commit]
fail_fast: false
