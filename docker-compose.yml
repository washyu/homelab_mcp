version: "3.8"

services:
  homelab-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homelab-mcp
    restart: unless-stopped
    ports:
      - "${MCP_HTTP_PORT:-8080}:8080"
    environment:
      # Authentication - REQUIRED: Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
      - MCP_API_KEY=${MCP_API_KEY:?MCP_API_KEY is required. Generate one with: python -c "import secrets; print(secrets.token_urlsafe(32))"}
      - MCP_AUTH_ENABLED=${MCP_AUTH_ENABLED:-true}
      # Server configuration
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      # Database configuration (optional)
      - MCP_DB_TYPE=${MCP_DB_TYPE:-sqlite}
      # SSH configuration (for remote device management)
      - SSH_KEY_PATH=/home/mcp/.ssh/mcp_admin_rsa
    volumes:
      # Persist database and SSH keys
      - mcp-data:/home/mcp/.homelab_mcp
      - mcp-ssh:/home/mcp/.ssh
      # Optional: Mount host SSH keys for accessing homelab devices
      # - ~/.ssh/id_rsa:/home/mcp/.ssh/id_rsa:ro
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mcp-data:
    name: homelab-mcp-data
  mcp-ssh:
    name: homelab-mcp-ssh

networks:
  mcp-network:
    name: homelab-mcp-network
